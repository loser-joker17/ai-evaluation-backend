services:
  postgres:
    image: postgres:16
    container_name: ai_eval_postgres
    environment:
      POSTGRES_DB: ai_evaluation
      POSTGRES_USER: ai_eval
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: