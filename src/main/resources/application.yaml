spring:
  application:
    name: ai-evaluation-backend
  config:
    import: ""
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2   # dispatcher and reconciler each get a thread; a slow GET /jobs never delays dispatch

server:
  port: ${SERVER_PORT:8081}
  # Behind a reverse proxy (Nginx, Render, Railway...): read the real client IP and https
  # from X-Forwarded-* headers. Needed for the login rate limit (B2) and secure cookies.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never      # don't reveal DB/disk details to the internet
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aievaluation.backend: INFO   # DEBUG only in dev

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    issuer: ai-evaluation-backend
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    cookie-secure: true
    cookie-same-site: Strict
    token-cleanup-cron: ${TOKEN_CLEANUP_CRON:0 30 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  quota:
    daily-submissions: ${DAILY_SUBMISSION_LIMIT:5}
    zone: Asia/Kolkata
  evaluator:
    base-url: ${EVALUATOR_URL:http://localhost:8000}
    internal-key: ${EVALUATOR_INTERNAL_KEY}
    connect-timeout: 5s
    read-timeout: 30s
    dispatch-interval: 5s
    reconcile-interval: 60s