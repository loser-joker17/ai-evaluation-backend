spring:
  application:
    name: ai-evaluation-backend
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.aievaluation.backend: DEBUG
app:
  auth:
    jwt-secret: ${JWT_SECRET}
    issuer: ai-evaluation-backend
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  quota:
    daily-submissions: ${DAILY_SUBMISSION_LIMIT:5}
    zone: Asia/Kolkata
  evaluator:
    base-url: ${EVALUATOR_URL:http://localhost:8000}
    internal-key: ${EVALUATOR_INTERNAL_KEY}
    connect-timeout: 5s
    read-timeout: 30s
    dispatch-interval: 5s
    dispatch-batch-size: 5